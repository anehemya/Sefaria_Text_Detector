name: sefaria_text_detector
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tesseract_ocr: ^0.4.23
  path_provider: ^2.1.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image_cropper: ^8.0.1
  http: ^1.1.0
  url_launcher: ^6.1.14


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/tessdata/eng.traineddata
    - assets/tessdata/heb.traineddata
    - assets/tessdata_config.json